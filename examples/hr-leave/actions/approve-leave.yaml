apiVersion: semantic.platform/v1
kind: Action
metadata:
  id: hr.leave.ApproveLeave
  name: ApproveLeave
  namespace: hr.leave
  description: 批准请假申请，并在审批通过后写回状态
spec:
  preconditions:
    - expression: LeaveRequest.status == 'pending'
      description: 只有待审批的申请可以批准
  permissions:
    - role: manager
      description: 直属主管可以发起批准
  approval:
    required: true
    approverRoles:
      - manager
    description: 写入须经直属主管确认。是否另须人事审批由 Policy 按工作日门槛判断，未超过门槛时不要求 hr_admin。
  writeBack:
    target: hr.leave.LeaveRequest
    operation: update
    fields:
      - status
      - approved_by
      - approved_at
